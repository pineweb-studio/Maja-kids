<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Entrar · Painel Maja Kids</title>
<link rel="icon" type="image/webp" href="../img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="entrada">
  <form class="cartao" id="form">
    <img src="../img/logo.webp" alt="Maja Kids">
    <div style="text-align:center;display:grid;gap:4px"><span class="olho">Área do dono</span><h1>Painel da Maja Kids</h1></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required maxlength="200" autofocus></div>
    <p class="erro-msg" id="erro" aria-live="polite"></p>
    <button class="btn primario" id="entrar">Entrar</button>
    <a href="../" class="suave" style="text-align:center;font-size:.85rem">Voltar ao site</a>
  </form>
</main>
<script src="comum.js"></script>
<script>
(() => {
  const destino = () => {
    const v = new URLSearchParams(location.search).get("voltar") || "";
    return /^\/admin\/[a-z-]+(\.html)?$/.test(v) ? v : "reservas";
  };
  // Já está logado? vai direto
  fetch("/api/admin/sessao", { credentials: "same-origin" }).then(r => { if (r.ok) location.replace(destino()); }).catch(() => {});
  document.getElementById("form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const bt = document.getElementById("entrar"), erro = document.getElementById("erro");
    bt.disabled = true; erro.textContent = "";
    try {
      await Painel.api("login", { senha: document.getElementById("senha").value });
      location.replace(destino());
    } catch (e) { erro.textContent = e.message; bt.disabled = false; }
  });
})();
</script>
</body>
</html>
