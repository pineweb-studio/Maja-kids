<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Acervo · Painel Maja Kids</title>
<link rel="icon" type="image/webp" href="../img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="miolo">
  <div class="cabeca">
    <div><span class="olho">Painel</span><h1>Acervo</h1></div>
    <div class="ferramentas">
      <label class="suave" style="font-weight:700;font-size:.86rem">Ver o dia <input type="date" class="in" id="dia" style="width:auto;display:inline-block"></label>
      <button class="btn" id="btn-custos-compra">Preços e custo de compra</button>
      <button class="btn primario" id="btn-manut">+ Manutenção</button>
    </div>
  </div>
  <div class="rolagem"><table class="lista-tab"><thead><tr><th>Brinquedo</th><th>Situação no dia</th><th class="dir">Gasto em manutenção</th><th></th></tr></thead><tbody id="consulta"></tbody></table></div>
  <section class="bloco"><h2>Manutenções</h2><div class="rolagem"><table class="lista-tab"><thead><tr><th>Brinquedo</th><th>Defeito</th><th>Início</th><th>Previsão / volta</th><th>Situação</th><th class="dir">Gastos</th><th></th></tr></thead><tbody id="manutencoes"></tbody></table></div></section>
  <section class="bloco"><h2>Gastos de manutenção <button class="btn pequeno" id="btn-gasto">+ Gasto</button></h2><div class="rolagem"><table class="lista-tab"><thead><tr><th>Data</th><th>Brinquedo</th><th>Descrição</th><th class="dir">Valor</th><th></th></tr></thead><tbody id="gastos"></tbody></table></div></section>
  <p class="rodape-painel">Painel Maja Kids · feito pela PineWeb</p>
</main>
<script src="comum.js"></script>
<script src="acervo.js"></script>
</body>
</html>
